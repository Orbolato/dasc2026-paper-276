name: Normalize meta description
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-meta-description.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<meta name="description" content="DASC 2026 paper page for Stochastic Strategic Demand-Capacity Balancing Using Model-Free Reinforcement Learning." />'
          new = '<meta name="description" content="DASC 2026 paper on model-free reinforcement learning for stochastic strategic demand-capacity balancing under weather uncertainty in ATM and UAM." />'
          if old not in text:
              raise SystemExit('Expected meta description not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Normalize DASC meta description for Bing SEO"
          git push
